name: PR Tests

on:
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  all-tests-plan:
    name: AllTestsPlan
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create CI secrets config
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: |
          mkdir -p Config
          printf 'TMDB_BEARER_TOKEN=%s\n' "$TMDB_BEARER_TOKEN" > Config/Secrets.xcconfig

      - name: Run AllTestPlan
        run: |
          xcodebuild test \
            -project Movies.xcodeproj \
            -scheme Movies \
            -testPlan AllTestPlan \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17'
